# GitLab CI/CD Configuration - Medium Tier
# Enhanced CI/CD with security scanning, compliance, and container registry
# Features: All Simple features + SAST, Dependency Scanning, Container Registry, Compliance

stages:
  - lint
  - security-sast
  - security-dependency
  - test
  - build
  - container-build
  - compliance
  - deploy-staging
  - integration-test
  - deploy-production

variables:
  NODE_CACHE_KEY: "${CI_COMMIT_REF_SLUG}-node"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  # Container registry
  CI_REGISTRY_IMAGE: ${CI_REGISTRY}/${CI_PROJECT_PATH}

cache:
  key: ${NODE_CACHE_KEY}
  paths:
    - .npm/
    - node_modules/
  policy: pull-push

before_script:
  - npm ci --cache .npm --prefer-offline

# ===========================================
# LINT STAGE
# ===========================================
lint:
  stage: lint
  image: node:20-alpine
  script:
    - npm run lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH =~ /^release\//
    - if: $CI_COMMIT_BRANCH =~ /^hotfix\//
  allow_failure: false

# ===========================================
# SECURITY - SAST (Static Application Security Testing)
# ===========================================
sast:
  stage: security-sast
  image: registry.gitlab.com/gitlab-org/security-products/sast:latest
  variables:
    SAST_EXCLUDED_PATHS: "node_modules,dist,.git,tests"
  script:
    - /analyzer run
  artifacts:
    reports:
      sast: gl-sast-report.json
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH =~ /^release\//
  allow_failure: true

# ===========================================
# SECURITY - DEPENDENCY SCANNING
# ===========================================
dependency-scanning:
  stage: security-dependency
  image: registry.gitlab.com/gitlab-org/security-products/dependency-scanning:latest
  script:
    - /analyzer run
  artifacts:
    reports:
      dependency_scanning: gl-dependency-scanning-report.json
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH =~ /^release\//
  allow_failure: true

# ===========================================
# SECURITY - CONTAINER SCANNING (runs after container build)
# ===========================================
container-scanning:
  stage: security-dependency
  image: registry.gitlab.com/gitlab-org/security-products/container-scanning:latest
  variables:
    DOCKER_IMAGE: "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}"
  script:
    - /analyzer run
  artifacts:
    reports:
      container_scanning: gl-container-scanning-report.json
    expire_in: 1 week
  needs:
    - container-build
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH =~ /^release\//
  allow_failure: true

# ===========================================
# TEST STAGE
# ===========================================
unit-tests:
  stage: test
  image: node:20-alpine
  script:
    - npm run test:unit
  coverage: '/COVERAGE:\s\d+\.\d+/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH =~ /^release\//

# ===========================================
# BUILD STAGE
# ===========================================
build:
  stage: build
  image: node:20-alpine
  script:
    - npm run build
  artifacts:
    expire_in: 1 hour
    paths:
      - dist/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH =~ /^release\//

# ===========================================
# CONTAINER BUILD STAGE
# ===========================================
container-build:
  stage: container-build
  image: docker:24-cli
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
    - docker build --pull -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE:latest"
    - docker push "$CI_REGISTRY_IMAGE:latest"
  artifacts:
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH =~ /^release\//
  only:
    - main
    - release/*

# ===========================================
# COMPLIANCE STAGE
# ===========================================
license-compliance:
  stage: compliance
  image: registry.gitlab.com/gitlab-org/security-products/license-compliance:latest
  script:
    - /analyzer run
  artifacts:
    reports:
      license_scanning: gl-license-scanning-report.json
    expire_in: 1 month
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH =~ /^release\//
  allow_failure: true

compliance-check:
  stage: compliance
  image: node:20-alpine
  script:
    - echo "Running compliance checks..."
    - npx license-checker --production --json > license-report.json
    - node scripts/compliance-check.js
  artifacts:
    reports:
      license_scanning: license-report.json
    expire_in: 1 month
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH =~ /^release\//

# ===========================================
# DEPLOY STAGING
# ===========================================
deploy-staging:
  stage: deploy-staging
  image: registry.example.com/deploy-tools:latest
  environment:
    name: staging
    url: https://staging.example.com
  script:
    - echo "Deploying to staging environment..."
    - IMAGE_TAG="${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}" deploy.sh staging
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  only:
    - develop

# ===========================================
# INTEGRATION TESTS (against staging)
# ===========================================
integration-tests:
  stage: integration-test
  image: node:20-alpine
  environment:
    name: staging
  script:
    - npm run test:integration
  artifacts:
    reports:
      junit: test-results/junit.xml
    expire_in: 1 week
  needs:
    - deploy-staging
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  only:
    - develop

# ===========================================
# DEPLOY PRODUCTION
# ===========================================
deploy-production:
  stage: deploy-production
  image: registry.example.com/deploy-tools:latest
  environment:
    name: production
    url: https://example.com
  script:
    - echo "Deploying to production environment..."
    - IMAGE_TAG="${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}" deploy.sh production
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  only:
    - main

# ===========================================
# NOTIFICATIONS
# ===========================================
notify-staging:
  stage: deploy-staging
  image: curlimages/curl:latest
  script:
    - curl -X POST -H "Content-Type: application/json" -d '{"text":"🚀 Staging deployment completed"}' $SLACK_WEBHOOK_URL
  needs:
    - deploy-staging
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

notify-production:
  stage: deploy-production
  image: curlimages/curl:latest
  script:
    - curl -X POST -H "Content-Type: application/json" -d '{"text":"✅ Production deployment completed"}' $SLACK_WEBHOOK_URL
  needs:
    - deploy-production
  rules:
    - if: $CI_COMMIT_BRANCH == "main"